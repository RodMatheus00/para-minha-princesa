<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16110f" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Para você</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23a3301f'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body data-tema="claro">
  <section id="lock" class="tema-claro">
    <div class="grad" aria-hidden="true"></div>
    <p class="eyebrow">Para <span class="js-nome"></span></p>
    <div class="lock-main">
      <h1 class="serif" id="lock-titulo"></h1>
      <div class="lock-field">
        <input id="senha" type="tel" inputmode="numeric" placeholder="dd/mm/aaaa" maxlength="10" autocomplete="off" aria-label="Data do primeiro beijo" />
        <button id="btn-entrar" aria-label="Abrir">→</button>
      </div>
      <p id="lock-msg" class="lock-msg"></p>
    </div>
    <p class="lock-foot hand">tem música no final, deixa o som ligado</p>
  </section>

  <main id="stories" hidden>
    <div id="bars" class="bars"></div>
    <div id="stage" class="stage"></div>
    <p id="hint" class="hint">toque para avançar · segure para pausar</p>
    <div id="yt-wrap" class="yt-wrap" aria-hidden="true">
      <div id="yt"></div>
      <p class="hand">toque no vídeo pra tocar ♪</p>
    </div>
  </main>

  <script src="config.js?v=3"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
